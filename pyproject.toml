[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "negotrain"
version = "0.1.0"
description = "Adaptive negotiation training through human-centered reinforcement learning (CS2822r)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Yash Ravipati" },
  { name = "Mahdi Nassereddine" },
  { name = "Vincent Song" },
]
dependencies = [
  "anthropic>=2.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
analysis = ["pandas>=2.2", "scipy>=1.13", "matplotlib>=3.9", "jupyter>=1.0"]

[project.scripts]
negotrain = "negotrain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/negotrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real LLM API and costs money (deselected by default; run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
